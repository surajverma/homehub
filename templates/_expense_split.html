{# "Split with" picker shared by the expense modal and the recurring rule forms #}
{% macro split_box(people, mode='equal', weights={}, selected=none, allow_amount=true) %}
<div class="split-box">
  <input type="hidden" name="split_present" value="1">
  <div class="flex items-center justify-between gap-2">
    <label class="text-sm text-gray-600">Split with</label>
    <select name="split_mode" class="split-mode border rounded p-1 text-sm">
      <option value="equal" {% if mode == 'equal' %}selected{% endif %}>Equally</option>
      <option value="shares" {% if mode == 'shares' %}selected{% endif %}>By shares</option>
      <option value="percent" {% if mode == 'percent' %}selected{% endif %}>By percentage</option>
      {% if allow_amount %}<option value="amount" {% if mode == 'amount' %}selected{% endif %}>By amount</option>{% endif %}
    </select>
  </div>
  <div class="split-rows mt-1 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1">
    {% for member in people %}
    <div class="split-row flex items-center justify-between gap-2 text-sm">
      <label class="inline-flex items-center gap-2 min-w-0">
        <input type="checkbox" name="split_with" value="{{ member }}" class="rounded split-member" {% if selected is none or member in selected %}checked{% endif %}>
        <span class="min-w-0">
          <span class="block truncate">{{ member }}</span>
          <span class="split-share block text-xs text-gray-500"></span>
        </span>
      </label>
      <input type="number" step="any" min="0" name="split_weight__{{ member }}" value="{{ weights.get(member, '') }}" class="split-weight border rounded text-right hidden" aria-label="{{ member }} split value">
    </div>
    {% endfor %}
  </div>
  <p class="split-hint text-xs text-gray-500 mt-1"></p>
</div>
{% endmacro %}

{% macro split_script() %}
<style>
  /* Mode dropdown and value fields form one right-hand column: same width, same height */
  .split-box select.split-mode,
  .split-box input.split-weight { width: 9rem; height: 2rem !important; padding: 0.25rem 0.5rem; flex-shrink: 0; }
  .split-box input.split-weight:disabled { opacity: 0.4; }
  /* Spinner arrows are no use on money and quantity fields */
  .split-box input.split-weight,
  #expense-form input[type="number"],
  #recurring-form input[type="number"],
  .recurring-edit-form input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .split-box input.split-weight::-webkit-inner-spin-button,
  .split-box input.split-weight::-webkit-outer-spin-button,
  #expense-form input[type="number"]::-webkit-inner-spin-button,
  #expense-form input[type="number"]::-webkit-outer-spin-button,
  #recurring-form input[type="number"]::-webkit-inner-spin-button,
  #recurring-form input[type="number"]::-webkit-outer-spin-button,
  .recurring-edit-form input[type="number"]::-webkit-inner-spin-button,
  .recurring-edit-form input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
</style>
<script>
// Split picker behaviour: opts = { getTotal: () => number|string, fmt: n => string, precision: () => number }
window.ExpenseSplit = {
  init(box, opts){
    const modeSel = box.querySelector('.split-mode');
    const hint = box.querySelector('.split-hint');
    const rows = [...box.querySelectorAll('.split-row')].map(r=>({
      cb: r.querySelector('.split-member'), w: r.querySelector('.split-weight'), out: r.querySelector('.split-share'),
    }));
    const num = n => String(Number(n.toFixed(2)));
    const prec = () => (opts.precision ? opts.precision() : 2);
    const total = () => { const t = parseFloat(opts.getTotal ? opts.getTotal() : ''); return isNaN(t) ? null : t; };
    const ticked = () => rows.filter(r=>r.cb.checked);

    // Fill the ticked rows with equal values that add up to `sum`
    function spread(sum, digits){
      const rs = ticked(); if (!rs.length) return;
      const f = Math.pow(10, digits), base = Math.floor(sum * f / rs.length) / f;
      rs.forEach((r, i)=>{ r.w.value = String(Number((i === rs.length-1 ? sum - base*(rs.length-1) : base).toFixed(digits))); });
    }
    function fillDefaults(){
      const mode = modeSel.value;
      // Values from the previous mode mean something else, so start clean
      rows.forEach(r=>{ r.w.value = ''; });
      if (mode === 'shares') ticked().forEach(r=>{ r.w.value = '1'; });
      if (mode === 'percent') spread(100, 2);
      if (mode === 'amount' && total() != null) spread(total(), prec());
    }
    function refresh(){
      const mode = modeSel.value, uneven = mode !== 'equal', t = total();
      // Names alone fit two to a row; names with a value and a share need the full width
      box.querySelector('.split-rows').classList.toggle('sm:grid-cols-2', !uneven);
      rows.forEach(r=>{ r.w.classList.toggle('hidden', !uneven); r.w.disabled = !uneven || !r.cb.checked; r.out.textContent = ''; });
      const rs = ticked();
      const weights = rs.map(r=> uneven ? (parseFloat(r.w.value) || 0) : 1);
      const sum = weights.reduce((a, b)=>a+b, 0);
      if (mode !== 'amount' && t != null && t > 0 && sum > 0) rs.forEach((r, i)=>{ r.out.textContent = opts.fmt(t * weights[i] / sum); });
      let msg = '', bad = false;
      if (!rs.length) msg = "Nobody ticked: a personal expense that isn't shared.";
      else if (uneven && sum <= 0){ bad = true; msg = 'Enter a value for at least one person.'; }
      else if (mode === 'shares') msg = 'Each person pays in proportion to their shares.';
      else if (mode === 'percent'){
        const left = 100 - sum; bad = Math.abs(left) > 0.01;
        msg = bad ? `Percentages add up to ${num(sum)}%: ${left > 0 ? num(left) + '% left to assign' : num(-left) + '% too much'}.` : 'Percentages add up to 100%.';
      } else if (mode === 'amount'){
        if (t == null){ bad = true; msg = 'Enter the total amount first.'; }
        else {
          const left = t - sum; bad = Math.abs(left) > 0.5 / Math.pow(10, prec());
          msg = bad ? `Amounts add up to ${opts.fmt(sum)} of ${opts.fmt(t)}: ${left > 0 ? opts.fmt(left) + ' left to assign' : opts.fmt(-left) + ' too much'}.` : `Amounts add up to ${opts.fmt(t)}.`;
        }
      }
      hint.textContent = msg;
      hint.classList.toggle('text-red-600', bad);
      hint.classList.toggle('text-gray-500', !bad);
      return !bad;
    }

    modeSel.addEventListener('change', ()=>{ fillDefaults(); refresh(); });
    rows.forEach(r=>{
      r.cb.addEventListener('change', ()=>{
        if (!r.cb.checked) r.w.value = '';
        else if (modeSel.value === 'shares' && !r.w.value) r.w.value = '1';
        refresh();
      });
      r.w.addEventListener('input', refresh);
    });
    const form = box.closest('form');
    if (form) form.addEventListener('submit', (evt)=>{
      if (!refresh()){ evt.preventDefault(); evt.stopImmediatePropagation(); hint.scrollIntoView({block: 'nearest'}); }
    });
    refresh();

    return {
      refresh,
      // members: array of names, or null to tick everyone
      set(members, mode, weights){
        modeSel.value = mode || 'equal';
        rows.forEach(r=>{
          r.cb.checked = members === null ? true : members.includes(r.cb.value);
          r.w.value = (weights && weights[r.cb.value] != null) ? weights[r.cb.value] : '';
        });
        refresh();
      },
      tick(name){
        const r = rows.find(x=>x.cb.value === name);
        if (r && !r.cb.checked){ r.cb.checked = true; r.cb.dispatchEvent(new Event('change')); }
      },
    };
  },
};
</script>
{% endmacro %}
