services:
  homehub:
    container_name: homehub
    image: ghcr.io/surajverma/homehub:latest
    # build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/media
      - ./pdfs:/app/pdfs
      - ./data:/app/data
      - ./config.yml:/app/config.yml:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:-} # optional, from .env; left empty, a key is generated once and kept in data/secret_key
      #- TZ=Asia/Kolkata # optional; your timezone for due dates and recurring items (default UTC)
